spring:
  application:
    name: fcareer-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: tr-TR
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fcareer}
    username: ${DB_USERNAME:fcareer}
    password: ${DB_PASSWORD:fcareer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

fcareer:
  seed:
    enabled: true
  cache:
    reference-ttl: 6h

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# --- Faz 2: ingestion / katalog (CONFIG) ---
# provider: mock (dev) | drop-api. FC27 çıkışında game-version-id=27 ve drop-api branding yeniden doğrulanmalı (drop_api_fc27_rollover).
fcareer.ingestion:
  provider: ${INGESTION_PROVIDER:mock}
  game-version-id: ${INGESTION_GAME_VERSION:25}
  run-on-startup: ${INGESTION_RUN_ON_STARTUP:false}
  admin-key: ${ADMIN_KEY:}
  open-dataset:
    license-confirmed: false
fcareer.catalog:
  default-game-version: ${CATALOG_DEFAULT_GAME_VERSION:25}
