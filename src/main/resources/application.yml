spring:
  application:
    name: fcareer-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: tr-TR
  # DEPLOY-01: yerel compose DB_URL/DB_USERNAME/DB_PASSWORD verir; Railway Postgres PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
  # (DATABASE_URL JDBC biçiminde değil). İkisi de yoksa yerel varsayılan.
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fcareer}}
    username: ${DB_USERNAME:${PGUSER:fcareer}}
    password: ${DB_PASSWORD:${PGPASSWORD:fcareer}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      # DEPLOY-01: Railway Redis REDIS_URL (parola dahil); yerel compose REDIS_HOST.
      url: ${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      # LE log'u oturum boyunca birikir (dışa aktarım başına ~11 MB); ayrıştırıcı akarak en fazla iki dışa aktarımı bellekte tutar.
      max-file-size: 64MB
      max-request-size: 66MB

fcareer:
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  ratelimit:
    register:
      daily-per-ip: ${FCAREER_RATELIMIT_REGISTER_DAILY_PER_IP:5}
  auth:
    bootstrap-admin-email: ${FCAREER_BOOTSTRAP_ADMIN_EMAIL:}
    email-verification:
      # Boş: MAIL_HOST tanımlıysa açık, değilse kapalı (kapalıyken kayıt ve kredi bugünkü gibi çalışır).
      enabled: ${EMAIL_VERIFICATION_ENABLED:}
      web-base-url: ${WEB_BASE_URL:http://localhost:8081}
  seed:
    enabled: true
  cache:
    reference-ttl: 6h

server:
  # DEPLOY-01: Railway PORT'u verir (servis değişkeni olarak sabitlenir; docs/deploy/RAILWAY.md).
  port: ${PORT:${SERVER_PORT:8080}}
  # PROD-PREP 6a: X-Forwarded-For işlenmez (istemci ekleyebilir). İstemci IP'si yalnız FCAREER_TRUST_PROXY=true iken X-Real-IP'den (ClientIp).
  forward-headers-strategy: none

management:
  health:
    # Posta sunucusu opsiyonel (E-posta doğrulaması kapalıyken yok); göstergesi servisi DOWN yapmasın.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# --- Faz 2: ingestion / katalog (CONFIG) ---
# provider: mock (dev) | ea-site (EA ratings sayfası, FC27). Yalnızca FC27 desteklenir; ea-site başlık denetimi başka sürümde durur.
fcareer.ingestion:
  provider: ${INGESTION_PROVIDER:mock}
  game-version-id: ${INGESTION_GAME_VERSION:27}
  run-on-startup: ${INGESTION_RUN_ON_STARTUP:false}
  admin-key: ${ADMIN_KEY:}
  open-dataset:
    license-confirmed: false
fcareer.catalog:
  default-game-version: ${CATALOG_DEFAULT_GAME_VERSION:27}

# --- Faz 7: güvenlik / billing (CONFIG) ---
# JWT_SECRET zorunlu (>= 32 byte); kodda varsayılan secret YOK.
fcareer.security:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # PROD-PREP 6a: yalnız ters vekil (Railway edge → web nginx) arkasında true; backend'in herkese açık adresi olmamalı.
  trust-proxy: ${FCAREER_TRUST_PROXY:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
  rate-limit:
    enabled: true
    auth-per-minute: 10
    # Kullanıcı başına dakikada (oturumsuzsa IP başına). 120 hızlı sekme gezintisinde doluyordu (sayfa başına ~10-20 istek).
    api-per-minute: 300
    # Kart/yüz görselleri ayrı kova: sayfa başına ~48 görsel.
    image-per-minute: 1200
fcareer.billing:
  # PROD-PREP 2: günlük kredi limiti (tek yer) ve ücretsiz beta (kodda kapalı; prod env'de FCAREER_FREE_BETA=true)
  daily-credits: ${FCAREER_DAILY_CREDITS:30}
  free-beta: ${FCAREER_FREE_BETA:false}
  credit-zone: Europe/Istanbul
  squad-fit-cost: 5
  recommend-cost: 3
  advisor-cost: 8
  subscription-days: 30
  stub-enabled: ${BILLING_STUB_ENABLED:false}

# --- Faz 6: ML servisi ---
fcareer.ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  shared-secret: ${ML_SHARED_SECRET:}
  batch-size: 500
  age-reference-date: ${ML_AGE_REFERENCE_DATE:2026-10-05}

# Swagger yalnız geliştirmede (SWAGGER_ENABLED=true); prod'da kapalı.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
