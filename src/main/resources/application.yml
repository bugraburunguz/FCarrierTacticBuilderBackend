spring:
  application:
    name: fcareer-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: tr-TR
  # DEPLOY-01: yerel compose DB_URL/DB_USERNAME/DB_PASSWORD verir; Railway Postgres PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD
  # (DATABASE_URL JDBC biçiminde değil). İkisi de yoksa yerel varsayılan.
  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:fcareer}}
    username: ${DB_USERNAME:${PGUSER:fcareer}}
    password: ${DB_PASSWORD:${PGPASSWORD:fcareer}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      # LE log'u oturum boyunca birikir (dışa aktarım başına ~11 MB); ayrıştırıcı akarak en fazla iki dışa aktarımı bellekte tutar.
      max-file-size: 64MB
      max-request-size: 66MB

fcareer:
  manager:
    # MGR-a (verified:false, kaynak: "FM esinli, kalibre edilmedi"). İtibar = geçmiş tabanı + diploma katkısı (en çok 100).
    # Kulüp ihtiyacı = (0,6 × yurt içi + 0,4 × uluslararası prestij) − lig seviyesi düzeltmesi × (seviye − 1), aynı cinsiyette yüzdelik sıra.
    # İlgi: ihtiyaç ≤ itibar + 10; hayal: (itibar + 10, itibar + 25]. Diğer eşikler ManagerProperties'te.
    domestic-weight: 0.6
    international-weight: 0.4
    league-level-penalty: 1.0
    interest-margin: 10
    dream-margin: 25
    pool-size: 40
  academy:
    # ACADEMY-b kararı (verified:false): "Bekliyor" = altyapıda en az bu kadar ay ve son içe aktarmalarda OVR artışı yok.
    # Tek içe aktarmada artış ölçülemez: Bekliyor gösterilmez (yalnız Hazır/Gelişiyor).
    waiting-months: 12
    stall-imports: 2
    # GROWTH-CAL (verified:false, kaynak: Buğra): altyapı oyuncusu 16 yaşından önce A takıma alınamaz.
    min-promotion-age: 16
  growth:
    # GROWTH-CAL (verified:false, kaynak: Buğra oyun tecrübesi, ölçülmedi): sezon OVR kazancı tavanı — altyapıda (A takımda değil) ve A takımda.
    # Kalibrasyon raporu gerçek veri verince yeniden ayarlanır.
    academy-max-gain: 5
    first-team-max-gain: 8
    # GT-a (verified:false, kaynak: Buğra oyun tecrübesi, ölçülmedi): düşüş başlangıç yaşları — fiziksel önce, teknik (pas, dribling, şut) sonra,
    # zihinsel ve bitiricilik en geç. Yaşla kaybedilen toplam attribute puanı Dengeli ile aynı; plan bu kaybı plan attribute'larından
    # (plan-decline-delay yıl geç, plan-decline-factor kadar yavaş) plan dışına kaydırır. Kart OVR attribute'lardan (ana mevki formülü), zorlanmaz.
    # Kalibrasyon raporundaki declineBands gerçek düşüşü yaşa göre gösterir; değerler otomatik değişmez.
    decline-from-age: 30
    technical-decline-from-age: 32
    mental-decline-from-age: 34
    plan-decline-delay: 2
    plan-decline-factor: 0.5
  development:
    recommend:
      # GT-a (verified:false): Gelişim yaş bölümleri — Gençler ≤ max-age, Zirve arası, Tecrübeliler ≥ veteran-from-age.
      veteran-from-age: 30
  growth-track:
    # GTR-a (verified:false): kariyer içi içe aktarmada bütün kulüplerin anlık görüntüsü (aynı oyun ayı tek). Kariyer başına en çok max-snapshots;
    # aşılırsa en eskiler seyreltilir (en eski ve en yeni keep-recent korunur). Oynama kovası: dönemde oyuncu maçı / takım maçı;
    # 0 → oynamadı, < regular-from-ratio → az, ≥ → düzenli. Model değerleri bu işte değişmez.
    enabled: true
    max-snapshots: 60
    keep-recent: 12
    regular-from-ratio: 0.5
  fit:
    # FIT-3 kararı (verified:false): öneri dışı roller ("baseRole|Focus"). Dönüşüm ve gelişim önerisi hedefi olamaz; Lab'da elle seçilebilir,
    # uyum hesabında kalır. Vektör kalibrasyonundan sonra listeden çıkar.
    recommendation-excluded-roles:
      # wide_midfielder|Defend: seed vektörü fiilen defansif orta saha vektörü (DefAwareness 0,25 · Stamina 0,20 · Interceptions/StandingTackle 0,14);
      # LM normlarıyla top kazanan orta sahalara yanlış dönüşüm ve gelişim hedefi üretiyordu (Crewe: Taylor, Ure, Holíček, Dancey).
      - "wide_midfielder|Defend"
  # KARIYER-UX FAZ 3.1: listelenen mevki en iyi mevki overall'ına bu kadar (puan) yakınsa "en iyi mevki" olarak listelenen gösterilir.
  position:
    listed-preference: 1
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  ratelimit:
    register:
      daily-per-ip: ${FCAREER_RATELIMIT_REGISTER_DAILY_PER_IP:5}
  auth:
    bootstrap-admin-email: ${FCAREER_BOOTSTRAP_ADMIN_EMAIL:}
    email-verification:
      # Boş: MAIL_HOST tanımlıysa açık, değilse kapalı (kapalıyken kayıt ve kredi bugünkü gibi çalışır).
      enabled: ${EMAIL_VERIFICATION_ENABLED:}
      web-base-url: ${WEB_BASE_URL:http://localhost:8081}
  seed:
    enabled: true
  cache:
    reference-ttl: 6h

server:
  # DEPLOY-01: Railway PORT'u verir (servis değişkeni olarak sabitlenir; docs/deploy/RAILWAY.md).
  port: ${PORT:${SERVER_PORT:8080}}
  # PROD-PREP 6a: X-Forwarded-For işlenmez (istemci ekleyebilir). İstemci IP'si yalnız FCAREER_TRUST_PROXY=true iken X-Real-IP'den (ClientIp).
  forward-headers-strategy: none

management:
  health:
    # Posta sunucusu opsiyonel (E-posta doğrulaması kapalıyken yok); göstergesi servisi DOWN yapmasın.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# --- Faz 2: ingestion / katalog (CONFIG) ---
# provider: mock (dev) | ea-site (EA ratings sayfası, FC27). Yalnızca FC27 desteklenir; ea-site başlık denetimi başka sürümde durur.
fcareer.ingestion:
  provider: ${INGESTION_PROVIDER:mock}
  game-version-id: ${INGESTION_GAME_VERSION:27}
  run-on-startup: ${INGESTION_RUN_ON_STARTUP:false}
  admin-key: ${ADMIN_KEY:}
  open-dataset:
    license-confirmed: false
fcareer.catalog:
  default-game-version: ${CATALOG_DEFAULT_GAME_VERSION:27}

# --- Faz 7: güvenlik / billing (CONFIG) ---
# JWT_SECRET zorunlu (>= 32 byte); kodda varsayılan secret YOK.
fcareer.security:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # PROD-PREP 6a: yalnız ters vekil (Railway edge → web nginx) arkasında true; backend'in herkese açık adresi olmamalı.
  trust-proxy: ${FCAREER_TRUST_PROXY:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
  rate-limit:
    enabled: true
    auth-per-minute: 10
    # Kullanıcı başına dakikada (oturumsuzsa IP başına). 120 hızlı sekme gezintisinde doluyordu (sayfa başına ~10-20 istek).
    api-per-minute: 300
    # Kart/yüz görselleri ayrı kova: sayfa başına ~48 görsel.
    image-per-minute: 1200
fcareer.billing:
  # PROD-PREP 2: günlük kredi limiti (tek yer) ve ücretsiz beta (kodda kapalı; prod env'de FCAREER_FREE_BETA=true)
  daily-credits: ${FCAREER_DAILY_CREDITS:30}
  free-beta: ${FCAREER_FREE_BETA:false}
  credit-zone: Europe/Istanbul
  squad-fit-cost: 5
  recommend-cost: 3
  advisor-cost: 8
  subscription-days: 30
  stub-enabled: ${BILLING_STUB_ENABLED:false}

# --- Faz 6: ML servisi ---
fcareer.ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  shared-secret: ${ML_SHARED_SECRET:}
  batch-size: 500
  age-reference-date: ${ML_AGE_REFERENCE_DATE:2026-10-05}

# Swagger yalnız geliştirmede (SWAGGER_ENABLED=true); prod'da kapalı.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
