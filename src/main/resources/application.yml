spring:
  application:
    name: fcareer-backend
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  web:
    locale: tr-TR
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fcareer}
    username: ${DB_USERNAME:fcareer}
    password: ${DB_PASSWORD:fcareer}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 26MB
      max-request-size: 28MB

fcareer:
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  auth:
    bootstrap-admin-email: ${FCAREER_BOOTSTRAP_ADMIN_EMAIL:}
    registration:
      daily-per-ip: ${REGISTRATIONS_PER_IP_DAILY:5}
    email-verification:
      # Boş: MAIL_HOST tanımlıysa açık, değilse kapalı (kapalıyken kayıt ve kredi bugünkü gibi çalışır).
      enabled: ${EMAIL_VERIFICATION_ENABLED:}
      web-base-url: ${WEB_BASE_URL:http://localhost:8081}
  seed:
    enabled: true
  cache:
    reference-ttl: 6h

server:
  port: ${SERVER_PORT:8080}
  # nginx/compose arkasında gerçek istemci adresi (X-Forwarded-For) rate limit için kullanılır; yalnız özel ağ aralıkları güvenilir.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info

# --- Faz 2: ingestion / katalog (CONFIG) ---
# provider: mock (dev) | ea-site (EA ratings sayfası, FC27). Yalnızca FC27 desteklenir; ea-site başlık denetimi başka sürümde durur.
fcareer.ingestion:
  provider: ${INGESTION_PROVIDER:mock}
  game-version-id: ${INGESTION_GAME_VERSION:27}
  run-on-startup: ${INGESTION_RUN_ON_STARTUP:false}
  admin-key: ${ADMIN_KEY:}
  open-dataset:
    license-confirmed: false
fcareer.catalog:
  default-game-version: ${CATALOG_DEFAULT_GAME_VERSION:27}

# --- Faz 7: güvenlik / billing (CONFIG) ---
# JWT_SECRET zorunlu (>= 32 byte); kodda varsayılan secret YOK.
fcareer.security:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 14d
  rate-limit:
    enabled: true
    auth-per-minute: 10
    api-per-minute: 120
fcareer.billing:
  daily-credits: 20
  squad-fit-cost: 5
  recommend-cost: 3
  advisor-cost: 8
  subscription-days: 30
  stub-enabled: ${BILLING_STUB_ENABLED:false}

# --- Faz 6: ML servisi ---
fcareer.ml:
  base-url: ${ML_BASE_URL:http://localhost:8000}
  shared-secret: ${ML_SHARED_SECRET:}
  batch-size: 500
  age-reference-date: ${ML_AGE_REFERENCE_DATE:2026-10-05}

# Swagger yalnız geliştirmede (SWAGGER_ENABLED=true); prod'da kapalı.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
