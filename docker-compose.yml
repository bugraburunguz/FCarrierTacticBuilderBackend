name: fcarriertacticbuilder
# Tüm yığın: postgres + redis + ml (iç ağ) + backend + web (nginx, http://localhost:8081).
# Çalıştırma (bu klasörden): docker compose up -d --build   |   env: .env (örnek: .env.example)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: fcareer
      POSTGRES_USER: fcareer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcareer"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  ml:
    build: ./ml-service
    environment:
      ML_SHARED_SECRET: ${ML_SHARED_SECRET:?ML_SHARED_SECRET gerekli}
    # Port yayımlanmaz: yalnız compose ağındaki backend erişir.
    volumes:
      - ./ml-service/models:/srv/models:ro

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fcareer
      DB_USERNAME: fcareer
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli (>= 32 byte)}
      ADMIN_KEY: ${ADMIN_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FCAREER_FIT_ROLE_WEIGHTS_VERSION: ${FCAREER_FIT_ROLE_WEIGHTS_VERSION:-v1}
      ML_BASE_URL: http://ml:8000
      ML_SHARED_SECRET: ${ML_SHARED_SECRET:?ML_SHARED_SECRET gerekli}
      BILLING_STUB_ENABLED: ${BILLING_STUB_ENABLED:-false}
      INGESTION_PROVIDER: ${INGESTION_PROVIDER:-ea-site}
      INGESTION_GAME_VERSION: ${INGESTION_GAME_VERSION:-27}
      CATALOG_DEFAULT_GAME_VERSION: ${INGESTION_GAME_VERSION:-27}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:8081}
      FCAREER_BOOTSTRAP_ADMIN_EMAIL: ${FCAREER_BOOTSTRAP_ADMIN_EMAIL:-}
      REGISTRATIONS_PER_IP_DAILY: ${REGISTRATIONS_PER_IP_DAILY:-5}

  web:
    build: ../FCarrierTacticBuilderWeb
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  pgdata:
